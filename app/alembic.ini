# alembic.ini
# Configuration for Alembic database migrations

[alembic]
# Template for migration script file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Template for generating upgrade/downgrade function names
sourceless = false

# Path to migration scripts
script_location = alembic

# Version location (default: alembic_version table)
version_locations = %(script_location)s/versions

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL - will be overridden by env var
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S