version: '3.8'

services:
  # ---------------------------------------------------------
  # PostgreSQL - Primary Database
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: marinasan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marinasan}
      POSTGRES_USER: ${POSTGRES_USER:-marinasan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/seed.py:/docker-entrypoint-initdb.d/02-seed.py:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marinasan} -d ${POSTGRES_DB:-marinasan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - marinasan-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------
  # Redis - Cache & Sessions
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: marinasan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - marinasan-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------
  # Backend API - Flask + Gunicorn
  # ---------------------------------------------------------
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    container_name: marinasan-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-marinasan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marinasan}
      - REDIS_URL=redis://redis:6379/0
      - MARINASAN_JWT_SECRET=${MARINASAN_JWT_SECRET}
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - marinasan-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------
  # Frontend Build - Multi-stage (build -> nginx)
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: marinasan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - marinasan-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------
  # Nginx - Reverse Proxy + SSL Termination + Static Files
  # ---------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: marinasan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M
    networks:
      - marinasan-internal
      - marinasan-external
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------
  # Certbot - Automatic SSL Certificate Renewal
  # ---------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: marinasan-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --nginx; sleep 12h & wait $${!}; done'"
    networks:
      - marinasan-external

  # ---------------------------------------------------------
  # Prometheus - Metrics Collection (Optional)
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: marinasan-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - marinasan-internal
    profiles:
      - monitoring

  # ---------------------------------------------------------
  # Grafana - Visualization (Optional)
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: marinasan-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - marinasan-internal
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  marinasan-internal:
    driver: bridge
    internal: false
  marinasan-external:
    driver: bridge