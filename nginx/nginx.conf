# Nginx configuration for Marinasan Purchase System
# Place in: /etc/nginx/sites-available/marinasan
# Symlink to: /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;

# Upstream backend
upstream backend {
    least_conn;
    server backend:5002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Upstream frontend (if serving SPA build)
upstream frontend {
    server frontend:80 max_fails=3 fail_timeout=30s;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name marinasan.yourdomain.com app.marinasan.yourdomain.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marinasan.yourdomain.com app.marinasan.yourdomain.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/marinasan.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marinasan.yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/marinasan.yourdomain.com/chain.pem;

    # Modern SSL config (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # Logging
    access_log /var/log/nginx/marinasan_access.log combined;
    error_log /var/log/nginx/marinasan_error.log warn;

    # Client body limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Frontend (React SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }
    }

    # API endpoints
    location /api/ {
        # Rate limiting
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;

        # Login endpoint - stricter limit
        location = /api/auth/login {
            limit_req zone=login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        # Health check - no rate limit
        location = /api/health {
            proxy_pass http://backend;
            access_log off;
        }

        # File uploads
        location ~ ^/api/.*/upload {
            limit_req zone=upload burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        # Proxy to backend
        proxy_pass http://backend;
    }

    # WebSocket support (if needed)
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Static files (uploads)
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # Favicon & robots
    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    # Deny hidden files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}